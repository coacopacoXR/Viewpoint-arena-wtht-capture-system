# The `nginx-proxy` container: TLS termination for the whole stack.
#
# The ONLY service in docker-compose.yml that publishes a public port. Every
# other service is reached through here or not at all, which is what makes
# "capture-service is not exposed" a property of the topology rather than a
# convention somebody has to remember.
#
# Certificates come from ./deploy/certs on the host (mounted read-only), which
# install.sh populates with a self-signed pair for the hostname you gave it.

# WebSocket upgrades. Without this map, an `Upgrade: websocket` request is
# proxied as a plain HTTP/1.0 GET and PartyKit's socket closes immediately.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Port 80: redirect, never serve ──────────────────────────────────────────
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # ACME challenge first, so a real Let's Encrypt cert can be issued without
    # the redirect breaking validation.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443: the app ───────────────────────────────────────────────────────
server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    http2        on;
    server_name  _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Deliberately NOT sent by default. HSTS on a self-signed certificate for an
    # internal hostname pins browsers to a TLS identity they were warned about,
    # and undoing it means waiting out max-age on every machine that visited.
    # Uncomment once a certificate from a real CA is mounted instead:
    #
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # A recording upload is the largest body this stack proxies, and
    # CAPTURE_MAX_UPLOAD_BYTES defaults to 200 MiB. nginx's 1 MiB default would
    # reject a meeting with a 413 before capture-service ever saw it.
    client_max_body_size 256m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://app:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # /api/* is answered by the `app` container itself (see
        # deploy/nginx/app.conf, which returns an explicit JSON 501 until a
        # self-hosted API runtime exists). Proxying it through here unchanged
        # keeps that answer honest instead of turning it into an SPA fallback.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── Port 8443: PartyKit WebSocket ───────────────────────────────────────────
#
# A separate port rather than a path, because lib/usePartyPresence.ts builds
# `new PartySocket({ host: VITE_PARTYKIT_HOST, room })` and partysocket connects
# to `<host>/<room>` — the room id IS the first path segment, so there is no
# prefix nginx could mount PartyKit under without the app knowing about it.
#
# This is also what makes an HTTPS deployment work at all: partysocket chooses
# wss:// because the page is https, and a page served over TLS cannot open
# ws:// to port 1999 (mixed content — the browser blocks it silently). Point
# VITE_PARTYKIT_HOST at `<hostname>:8443` and the socket is wss:// end to end.
server {
    listen       8443 ssl;
    listen  [::]:8443 ssl;
    server_name  _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass         http://partykit:1999;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A review session is hours long. nginx's 60s default would drop an
        # idle room's socket and rely on partysocket's reconnect to paper over
        # it, which is how a deployment ends up with unexplained reconnect
        # churn in the metrics docs/plan/05-observability-and-metrics.md §4 asks
        # you to watch.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
