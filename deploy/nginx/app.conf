# The `app` container: nginx serving the Vite build.
#
# Copied to /etc/nginx/conf.d/default.conf by deploy/app.Dockerfile. Plain
# config, no envsubst: nothing in here is deployment-specific. The public
# hostname and TLS live on nginx-proxy, one hop out, so this file never changes
# between installs.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Recordings, GLB models and the built bundle are large; the compose
    # network is local so this is cheap, and it halves what nginx-proxy has to
    # re-serve over TLS.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        model/gltf+json
        model/gltf-binary;

    # ── /api/* ──────────────────────────────────────────────────────────────
    #
    # DELIBERATELY NOT THE SPA FALLBACK BELOW, and that is the whole reason
    # this block exists.
    #
    # A static nginx root with `try_files ... /index.html` answers EVERY unknown
    # path with 200 text/html — including /api/public-config and /api/health.
    # The browser clients then call response.json() on a React document and fail
    # with a bare SyntaxError that looks like a client bug. This is not
    # hypothetical: it is exactly what `vite preview` does, and it is why
    # lib/connectors/capture/extractClient.ts checks the content-type before
    # parsing.
    #
    # So /api/* answers with an explicit JSON status instead. 501 because the
    # api/* handlers in this repo are Vercel serverless functions and the
    # self-hosted stack does not yet run them: there is no Node runtime for
    # them in the prescribed service list (docs/plan/06-deployment-and-installation.md
    # §2 says `app` is "nginx serving the Vite build"), and inventing a
    # Vercel-compatible shim inside an installer ticket would ship untested glue
    # that has to handle the handlers' cookie, body-parsing and `.js`-suffixed
    # TypeScript import contracts. Tracked, not forgotten.
    #
    # WHEN AN API RUNTIME EXISTS, replace the `return` line with:
    #
    #     proxy_pass         http://<api-service>:8787;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    #     proxy_read_timeout 300s;   # a capture extraction is minutes, not seconds
    #
    # The 501 body keeps the /api/health shape so a poller parses it instead of
    # choking, and install.sh treats `api_runtime_not_deployed` as a documented
    # skip rather than a failed install.
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 501 '{"ok":false,"connectors":{},"error":"api_runtime_not_deployed"}';
    }

    # Vite emits content-hashed filenames under /assets, so these never change
    # identity without changing name. `immutable` stops a browser re-asking.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # Large binaries: no point buffering a GLB through nginx's memory.
    location ~* \.(glb|gltf|bin|woff2?)$ {
        expires    7d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # ── The SPA ─────────────────────────────────────────────────────────────
    # index.html itself must never be cached, or a deploy serves stale HTML that
    # points at asset filenames the new image no longer contains.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # A health probe for nginx-proxy and for `docker compose ps`, which does not
    # depend on the SPA bundle having been copied correctly.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
