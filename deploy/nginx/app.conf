# The `app` container: nginx serving the Vite build.
#
# Copied to /etc/nginx/templates/default.conf.template by deploy/app.Dockerfile,
# so the stock nginx entrypoint runs envsubst over it at CONTAINER START and
# writes /etc/nginx/conf.d/default.conf. That is what lets
# ${CAPTURE_SHARED_SECRET} come from the container's environment instead of
# being baked into the image — a secret in a layer is a secret in
# `docker history`. NGINX_ENVSUBST_FILTER is set to ^CAPTURE_ there, which is
# why this file is still allowed to use nginx's own $uri / $host / $proxy_*
# variables: only CAPTURE_* names are substituted.
#
# ${CAPTURE_SHARED_SECRET} is the ONLY placeholder. Everything else here is
# deployment-independent — the public hostname and TLS live on nginx-proxy, one
# hop out. An empty secret still produces a valid config: `proxy_set_header
# X-Capture-Token ""` makes nginx omit the header, which is what capture-service
# expects when its own secret is empty (authentication off).

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Recordings, GLB models and the built bundle are large; the compose
    # network is local so this is cheap, and it halves what nginx-proxy has to
    # re-serve over TLS.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        model/gltf+json
        model/gltf-binary;

    # ── /api/capture/local ────────────────────────────────────────────────────
    #
    # ABOVE the /api/ block on purpose, and it has to exist at all because of
    # that block: the self-hosted stack runs no API runtime, so without this
    # location a browser recording would be answered with the JSON 501 below.
    # This is the self-hosted half of LocalCaptureProvider (T4.4); on Vercel the
    # same path is api/capture/local.ts.
    #
    # Two properties matter here:
    #
    #   1. THE SECRET IS ADDED HERE AND NOWHERE IN THE BROWSER. The browser
    #      posts to a same-origin URL and never learns CAPTURE_SHARED_SECRET, so
    #      capture-service can keep publishing no port at all.
    #   2. IT MUST NOT STOP THE CONTAINER STARTING. `resolver` + a VARIABLE
    #      upstream makes nginx look capture-service up per request instead of at
    #      config-parse time. With a literal `proxy_pass
    #      http://capture-service:8080` nginx refuses to start whenever the
    #      capture profile is inactive, which is the default install — one
    #      unknown hostname would take the whole app container down. 127.0.0.11
    #      is Docker's embedded DNS.
    location = /api/capture/local {
        limit_except POST { deny all; }

        resolver 127.0.0.11 valid=30s;
        set $capture_upstream http://capture-service:8080;

        # With a variable in proxy_pass nginx does no URI rewriting of its own,
        # so the path has to be spelled out: capture-service mounts /capture at
        # the root.
        proxy_pass $capture_upstream/capture;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Capture-Token   "${CAPTURE_SHARED_SECRET}";

        # capture-service's own ceiling is CAPTURE_MAX_UPLOAD_BYTES, which
        # defaults to 209715200 (DEFAULT_MAX_UPLOAD_BYTES in
        # capture-service/capture_service/config.py) — exactly 200m. nginx must
        # not be the layer that rejects a legitimate recording first, or the
        # service's own legible `upload_too_large` is never reached.
        client_max_body_size 200m;
        # A 200 MiB upload is streamed straight through rather than spooled to
        # disk in the app container, which has no volume for it.
        proxy_request_buffering off;
        # Transcription plus a local LLM extraction over a whole meeting is
        # minutes. Matches UPSTREAM_TIMEOUT_MS in api/capture/local.ts.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ── /api/* ──────────────────────────────────────────────────────────────
    #
    # DELIBERATELY NOT THE SPA FALLBACK BELOW, and that is the whole reason
    # this block exists.
    #
    # A static nginx root with `try_files ... /index.html` answers EVERY unknown
    # path with 200 text/html — including /api/public-config and /api/health.
    # The browser clients then call response.json() on a React document and fail
    # with a bare SyntaxError that looks like a client bug. This is not
    # hypothetical: it is exactly what `vite preview` does, and it is why
    # lib/connectors/capture/extractClient.ts checks the content-type before
    # parsing.
    #
    # So /api/* answers with an explicit JSON status instead. 501 because the
    # api/* handlers in this repo are Vercel serverless functions and the
    # self-hosted stack does not yet run them: there is no Node runtime for
    # them in the prescribed service list (docs/plan/06-deployment-and-installation.md
    # §2 says `app` is "nginx serving the Vite build"), and inventing a
    # Vercel-compatible shim inside an installer ticket would ship untested glue
    # that has to handle the handlers' cookie, body-parsing and `.js`-suffixed
    # TypeScript import contracts. Tracked, not forgotten.
    #
    # The one exception is /api/capture/local above, which needs no runtime: it
    # is a header plus a proxy_pass, and it is the only path the self-hosted
    # capture flow requires.
    #
    # WHEN AN API RUNTIME EXISTS, replace the `return` line with:
    #
    #     proxy_pass         http://<api-service>:8787;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    #     proxy_read_timeout 300s;   # a capture extraction is minutes, not seconds
    #
    # The 501 body keeps the /api/health shape so a poller parses it instead of
    # choking, and install.sh treats `api_runtime_not_deployed` as a documented
    # skip rather than a failed install.
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 501 '{"ok":false,"connectors":{},"error":"api_runtime_not_deployed"}';
    }

    # Vite emits content-hashed filenames under /assets, so these never change
    # identity without changing name. `immutable` stops a browser re-asking.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # Large binaries: no point buffering a GLB through nginx's memory.
    location ~* \.(glb|gltf|bin|woff2?)$ {
        expires    7d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # ── The SPA ─────────────────────────────────────────────────────────────
    # index.html itself must never be cached, or a deploy serves stale HTML that
    # points at asset filenames the new image no longer contains.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # A health probe for nginx-proxy and for `docker compose ps`, which does not
    # depend on the SPA bundle having been copied correctly.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
