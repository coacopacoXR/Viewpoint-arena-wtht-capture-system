# The `app` container: nginx serving the Vite build.
#
# Copied to /etc/nginx/templates/default.conf.template by deploy/app.Dockerfile,
# so the stock nginx entrypoint runs envsubst over it at CONTAINER START and
# writes /etc/nginx/conf.d/default.conf. That is what lets
# ${CAPTURE_SHARED_SECRET} come from the container's environment instead of
# being baked into the image — a secret in a layer is a secret in
# `docker history`. NGINX_ENVSUBST_FILTER is set to ^CAPTURE_ there, which is
# why this file is still allowed to use nginx's own $uri / $host / $proxy_*
# variables: only CAPTURE_* names are substituted.
#
# ${CAPTURE_SHARED_SECRET} is the ONLY placeholder. Everything else here is
# deployment-independent — the public hostname and TLS live on nginx-proxy, one
# hop out. An empty secret still produces a valid config: `proxy_set_header
# X-Capture-Token ""` makes nginx omit the header, which is what capture-service
# expects when its own secret is empty (authentication off).

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Recordings, GLB models and the built bundle are large; the compose
    # network is local so this is cheap, and it halves what nginx-proxy has to
    # re-serve over TLS.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        model/gltf+json
        model/gltf-binary;

    # ── the access check the capture endpoints are held to ──────────────────
    #
    # nginx sends the two capture locations below through auth_request, which
    # asks this subrequest first and judges it by status alone: 204 lets the
    # request through, 401 refuses it.
    #
    # It matters because those two locations do NOT go through the `api`
    # container — nginx streams them straight to capture-service and adds the
    # shared secret itself. That secret keeps capture-service unreachable from
    # outside the compose network, but nginx adds it for every caller, so
    # before this anyone who could open the origin could make the server
    # transcribe audio and run the LLM even with a front-door password set.
    # The password guarded the UI; the GPU was open.
    #
    # `internal` means a browser cannot request this path directly. The body
    # is dropped: the handler only reads the cookie, and forwarding a 200 MiB
    # recording to it would be absurd.
    #
    # With no password configured /api/access-check answers 204 to everything,
    # so an install that chose to stay open is unaffected.
    location = /_access_check {
        internal;

        resolver 127.0.0.11 valid=30s;
        set $access_check_upstream http://api:8787;

        proxy_pass              $access_check_upstream/api/access-check;
        proxy_http_version      1.1;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host            $host;
        proxy_set_header        X-Original-URI  $request_uri;
    }

    # ── /api/capture/transcribe ─────────────────────────────────────────────
    #
    # Live-transcript chunks (T4.7). Same pattern as /api/capture/local above:
    # variable upstream, secret header added by nginx, resolver for Docker DNS.
    # The differences from /api/capture/local are:
    #   * upstream path is /transcribe (Whisper only, no LLM extraction);
    #   * client_max_body_size 10m (a chunk is ~8 s of audio, not a full meeting);
    #   * read/send timeouts 120s (one Whisper pass, not minutes of extraction).
    #
    # Rate-limit arithmetic (proxy.conf): 30 req/min burst 20 on /api/capture/.
    # One chunk per 8 s = 7.5 req/min, well within the limit even with the
    # burst headroom. No separate zone needed.
    location = /api/capture/transcribe {
        limit_except POST { deny all; }

        # Refused with 401 when this deployment has a front-door password and
        # the caller has not entered it. See /_access_check above.
        auth_request /_access_check;

        resolver 127.0.0.11 valid=30s;
        set $transcribe_upstream http://capture-service:8080;

        proxy_pass $transcribe_upstream/transcribe;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Capture-Token   "${CAPTURE_SHARED_SECRET}";

        # A live chunk is ~8 s of Opus audio, well under 1 MiB. 10m matches
        # the Vercel function body limit in api/capture/transcribe.ts.
        client_max_body_size 10m;
        proxy_request_buffering off;
        # One Whisper pass over a few seconds of audio. Matches the 120 s
        # UPSTREAM_TIMEOUT_MS in api/capture/transcribe.ts.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── /api/capture/local ────────────────────────────────────────────────────
    #
    # ABOVE the /api/ block on purpose: nginx streams the recording straight to
    # capture-service and adds the secret itself, rather than passing a 200 MB
    # upload through the `api` container. This is the self-hosted half of
    # LocalCaptureProvider (T4.4); on Vercel the same path is
    # api/capture/local.ts.
    #
    # Two properties matter here:
    #
    #   1. THE SECRET IS ADDED HERE AND NOWHERE IN THE BROWSER. The browser
    #      posts to a same-origin URL and never learns CAPTURE_SHARED_SECRET, so
    #      capture-service can keep publishing no port at all.
    #   2. IT MUST NOT STOP THE CONTAINER STARTING. `resolver` + a VARIABLE
    #      upstream makes nginx look capture-service up per request instead of at
    #      config-parse time. With a literal `proxy_pass
    #      http://capture-service:8080` nginx refuses to start whenever the
    #      capture profile is inactive, which is the default install — one
    #      unknown hostname would take the whole app container down. 127.0.0.11
    #      is Docker's embedded DNS.
    location = /api/capture/local {
        limit_except POST { deny all; }

        # Refused with 401 when this deployment has a front-door password and
        # the caller has not entered it. See /_access_check above.
        auth_request /_access_check;

        resolver 127.0.0.11 valid=30s;
        set $capture_upstream http://capture-service:8080;

        # With a variable in proxy_pass nginx does no URI rewriting of its own,
        # so the path has to be spelled out: capture-service mounts /capture at
        # the root.
        proxy_pass $capture_upstream/capture;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Capture-Token   "${CAPTURE_SHARED_SECRET}";

        # capture-service's own ceiling is CAPTURE_MAX_UPLOAD_BYTES, which
        # defaults to 209715200 (DEFAULT_MAX_UPLOAD_BYTES in
        # capture-service/capture_service/config.py) — exactly 200m. nginx must
        # not be the layer that rejects a legitimate recording first, or the
        # service's own legible `upload_too_large` is never reached.
        client_max_body_size 200m;
        # A 200 MiB upload is streamed straight through rather than spooled to
        # disk in the app container, which has no volume for it.
        proxy_request_buffering off;
        # Transcription plus a local LLM extraction over a whole meeting is
        # minutes. Matches UPSTREAM_TIMEOUT_MS in api/capture/local.ts.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ── /api/* ──────────────────────────────────────────────────────────────
    #
    # Proxied to the `api` service (server/api-server.ts running the same
    # api/*.ts files Vercel runs). NEVER the SPA fallback below: a static
    # try_files would answer /api/public-config with index.html, and the
    # browser would choke on response.json() with a bare SyntaxError.
    #
    # Resolved per request (resolver + variable), like /api/capture/local
    # above, so this container still starts while `api` is building or down;
    # a request then gets nginx's 502, which the API clients treat as
    # "unavailable" and fall back from.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://api:8787;

        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        # A cloud capture extraction or an Onshape translation poll can take
        # minutes; the handlers set their own shorter limits.
        proxy_read_timeout 300s;
        # Model imports and capture uploads are large.
        client_max_body_size 200m;
        add_header Cache-Control "no-store" always;
    }

    # Vite emits content-hashed filenames under /assets, so these never change
    # identity without changing name. `immutable` stops a browser re-asking.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # Large binaries: no point buffering a GLB through nginx's memory.
    location ~* \.(glb|gltf|bin|woff2?)$ {
        expires    7d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # ── The SPA ─────────────────────────────────────────────────────────────
    # index.html itself must never be cached, or a deploy serves stale HTML that
    # points at asset filenames the new image no longer contains.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # A health probe for nginx-proxy and for `docker compose ps`, which does not
    # depend on the SPA bundle having been copied correctly.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
